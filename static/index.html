<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HF Docs Agent</title>
    <script src="/static/marked.min.js"></script>
    <script>
      if (typeof marked === "undefined") {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/marked/marked.min.js";
        document.head.appendChild(s);
      }
    </script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        width: 100%;
        padding: 16px 24px;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      header h1 {
        font-size: 18px;
        font-weight: 600;
        color: #fff;
      }

      header span {
        font-size: 13px;
        color: #888;
      }

      #chat-container {
        width: 100%;
        max-width: 760px;
        flex: 1;
        overflow-y: auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 85%;
      }

      .message.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .message.agent {
        align-self: flex-start;
        align-items: flex-start;
        max-width: 100%;
        width: 100%;
      }

      .bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.6;
        word-break: break-word;
      }

      .message.user .bubble {
        background: #2563eb;
        color: #fff;
        border-bottom-right-radius: 4px;
        white-space: pre-wrap;
      }

      .message.agent .bubble {
        background: #1e1e1e;
        border: 1px solid #2a2a2a;
        color: #e0e0e0;
        border-bottom-left-radius: 4px;
        white-space: normal;
      }

      .message.agent .bubble > *:first-child {
        margin-top: 0;
      }
      .message.agent .bubble > *:last-child {
        margin-bottom: 0;
      }

      /* Markdown Output Formatting */
      .bubble p {
        margin: 0 0 10px 0;
      }

      .bubble h1,
      .bubble h2,
      .bubble h3,
      .bubble h4 {
        color: #fff;
        margin: 14px 0 6px 0;
        font-weight: 600;
      }

      .bubble h1 { font-size: 18px; }
      .bubble h2 { font-size: 16px; }
      .bubble h3 { font-size: 15px; }
      .bubble h4 { font-size: 14px; }

      .bubble ul,
      .bubble ol {
        margin: 0 0 10px 0;
        padding-left: 20px;
      }

      .bubble li {
        margin-bottom: 4px;
      }

      .bubble strong {
        color: #fff;
        font-weight: 600;
      }

      .bubble a {
        color: #60a5fa;
        text-decoration: underline;
      }

      .bubble blockquote {
        border-left: 3px solid #2563eb;
        padding-left: 12px;
        margin: 8px 0;
        color: #aaa;
      }

      .bubble code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #141414;
        color: #f87171;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 13px;
        border: 1px solid #2c2c2c;
      }

      .bubble pre {
        background: #141414;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 12px 14px;
        margin: 10px 0;
        overflow-x: auto;
      }

      .bubble pre code {
        background: transparent;
        padding: 0;
        border: none;
        color: #e0e0e0;
        font-size: 13px;
        line-height: 1.5;
        white-space: pre;
      }

      .bubble table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
        font-size: 13px;
        line-height: 1.5;
        border: 1px solid #333;
        border-radius: 6px;
        overflow: hidden;
      }

      .bubble th,
      .bubble td {
        padding: 8px 12px;
        border: 1px solid #333;
        text-align: left;
        vertical-align: top;
      }

      .bubble th {
        background: #252525;
        color: #fff;
        font-weight: 600;
      }

      .bubble td {
        background: #181818;
      }

      .bubble tr:nth-child(even) td {
        background: #1e1e1e;
      }

      .bubble hr {
        border: none;
        border-top: 1px solid #2a2a2a;
        margin: 12px 0;
      }

      .label {
        font-size: 11px;
        color: #555;
        padding: 0 4px;
      }

      .thinking {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        background: #1e1e1e;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        border-bottom-left-radius: 4px;
      }

      .thinking span {
        width: 6px;
        height: 6px;
        background: #555;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }

      .thinking span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .thinking span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-6px);
          background: #2563eb;
        }
      }

      #input-area {
        width: 100%;
        max-width: 760px;
        padding: 16px;
        display: flex;
        gap: 10px;
        border-top: 1px solid #2a2a2a;
      }

      #question {
        flex: 1;
        padding: 12px 16px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        color: #e0e0e0;
        font-size: 14px;
        outline: none;
        resize: none;
        height: 48px;
        line-height: 1.5;
      }

      #question:focus {
        border-color: #2563eb;
      }

      #question::placeholder {
        color: #555;
      }

      button {
        padding: 12px 20px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        background: #1e3a6e;
        cursor: not-allowed;
      }

      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 16px 16px;
        max-width: 760px;
        width: 100%;
      }

      .example-chip {
        padding: 6px 12px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 20px;
        font-size: 12px;
        color: #888;
        cursor: pointer;
        transition: all 0.2s;
      }

      .example-chip:hover {
        border-color: #2563eb;
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🤗 HF Docs Agent</h1>
      <span>Powered by RAG · Transformers & PEFT docs</span>
    </header>

    <div id="chat-container"></div>

    <div class="examples" id="examples">
      <div class="example-chip" onclick="useExample(this)">
        What does save_pretrained save to disk?
      </div>
      <div class="example-chip" onclick="useExample(this)">
        How do I apply LoRA with PEFT?
      </div>
      <div class="example-chip" onclick="useExample(this)">
        What is the difference between LoRA and QLoRA?
      </div>
      <div class="example-chip" onclick="useExample(this)">
        Show me how save_pretrained is implemented
      </div>
    </div>

    <div id="input-area">
      <textarea
        id="question"
        placeholder="Ask anything about HF Transformers or PEFT..."
      ></textarea>
      <button id="send-btn" onclick="sendMessage()">Ask</button>
    </div>

    <script>
      const chat = document.getElementById("chat-container");
      const input = document.getElementById("question");
      const btn = document.getElementById("send-btn");

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      function useExample(el) {
        input.value = el.textContent;
        input.focus();
      }

      function renderMarkdown(text) {
        if (typeof marked !== "undefined" && marked.parse) {
          try {
            return marked.parse(text);
          } catch (e) {
            console.error("marked.parse error, using fallback:", e);
          }
        }

        let html = text
          .replace(/&(?!amp;|lt;|gt;|quot;|#)/g, "&amp;")
          .replace(/<(?!\/?(br|strong|em|code)\b)[^>]*>/gi, "");

        // Code blocks
        html = html.replace(/```(\w+)?\n([\s\S]*?)```/g, function(_, lang, code) {
          return `<pre><code class="language-${lang || 'text'}">${code.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code></pre>`;
        });

        // Inline code
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");

        // Bold
        html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");

        // Italic
        html = html.replace(/(^|[^\*])\*([^*]+)\*([^\*]|$)/g, "$1<em>$2</em>$3");

        // Markdown tables
        const lines = html.split("\n");
        let inTable = false;
        let tableHtml = [];
        let newLines = [];

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i].trim();
          if (line.startsWith("|") && line.endsWith("|")) {
            if (!inTable) {
              inTable = true;
              tableHtml = ["<table>"];
            }
            if (line.includes("---")) {
              continue;
            }
            const cells = line.slice(1, -1).split("|").map(c => c.trim());
            const tag = tableHtml.length === 1 ? "th" : "td";
            tableHtml.push("<tr>" + cells.map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>");
          } else {
            if (inTable) {
              tableHtml.push("</table>");
              newLines.push(tableHtml.join(""));
              tableHtml = [];
              inTable = false;
            }
            newLines.push(lines[i]);
          }
        }
        if (inTable) {
          tableHtml.push("</table>");
          newLines.push(tableHtml.join(""));
        }

        html = newLines.join("\n");

        // Bullet lists
        html = html.replace(/(?:^|\n)(?:[-*]\s+.*(?:\n(?:\s{2,}|\t).*)*)+/g, function(match) {
          const items = match.trim().split(/\n(?=[-*]\s+)/).map(item => {
            return "<li>" + item.replace(/^[-*]\s+/, "").replace(/\n\s+/g, " ") + "</li>";
          });
          return "<ul>" + items.join("") + "</ul>";
        });

        // Numbered lists
        html = html.replace(/(?:^|\n)(?:\d+\.\s+.*(?:\n(?:\s{2,}|\t).*)*)+/g, function(match) {
          const items = match.trim().split(/\n(?=\d+\.\s+)/).map(item => {
            return "<li>" + item.replace(/^\d+\.\s+/, "").replace(/\n\s+/g, " ") + "</li>";
          });
          return "<ol>" + items.join("") + "</ol>";
        });

        // Headings
        html = html.replace(/^### (.*$)/gim, "<h3>$1</h3>");
        html = html.replace(/^## (.*$)/gim, "<h2>$1</h2>");
        html = html.replace(/^# (.*$)/gim, "<h1>$1</h1>");

        // Paragraphs & line breaks
        const blocks = html.split(/\n\n+/);
        html = blocks.map(b => {
          b = b.trim();
          if (!b) return "";
          if (b.startsWith("<table") || b.startsWith("<ul") || b.startsWith("<ol") || b.startsWith("<pre") || b.startsWith("<h")) {
            return b;
          }
          return "<p>" + b.replace(/\n/g, "<br>") + "</p>";
        }).join("\n");

        return html;
      }

      function addMessage(text, role) {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${role}`;
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = role === "user" ? "You" : "Agent";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (role === "agent") {
          bubble.innerHTML = renderMarkdown(text);
        } else {
          bubble.textContent = text;
        }
        wrapper.appendChild(label);
        wrapper.appendChild(bubble);
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
        return wrapper;
      }

      function addThinking() {
        const wrapper = document.createElement("div");
        wrapper.className = "message agent";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = "Agent";
        const dots = document.createElement("div");
        dots.className = "thinking";
        dots.innerHTML = "<span></span><span></span><span></span>";
        wrapper.appendChild(label);
        wrapper.appendChild(dots);
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
        return wrapper;
      }

      async function sendMessage() {
        const question = input.value.trim();
        if (!question) return;

        // Hide examples after first message
        document.getElementById("examples").style.display = "none";

        input.value = "";
        btn.disabled = true;

        addMessage(question, "user");
        const thinking = addThinking();

        try {
          const res = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });

          const data = await res.json();
          thinking.remove();
          addMessage(data.answer || "No answer returned.", "agent");
        } catch (err) {
          thinking.remove();
          addMessage("Something went wrong. Please try again.", "agent");
        }

        btn.disabled = false;
        input.focus();
      }
    </script>
  </body>
</html>
