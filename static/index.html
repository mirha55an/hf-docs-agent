<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HF Docs Agent</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f0f;
        color: #e0e0e0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      header {
        width: 100%;
        padding: 16px 24px;
        background: #1a1a1a;
        border-bottom: 1px solid #2a2a2a;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      header h1 {
        font-size: 18px;
        font-weight: 600;
        color: #fff;
      }

      header span {
        font-size: 13px;
        color: #888;
      }

      #chat-container {
        width: 100%;
        max-width: 760px;
        flex: 1;
        overflow-y: auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .message {
        display: flex;
        flex-direction: column;
        gap: 4px;
        max-width: 85%;
      }

      .message.user {
        align-self: flex-end;
        align-items: flex-end;
      }
      .message.agent {
        align-self: flex-start;
        align-items: flex-start;
      }

      .bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user .bubble {
        background: #2563eb;
        color: #fff;
        border-bottom-right-radius: 4px;
      }

      .message.agent .bubble {
        background: #1e1e1e;
        border: 1px solid #2a2a2a;
        color: #e0e0e0;
        border-bottom-left-radius: 4px;
      }

      .label {
        font-size: 11px;
        color: #555;
        padding: 0 4px;
      }

      .thinking {
        display: flex;
        gap: 4px;
        padding: 12px 16px;
        background: #1e1e1e;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        border-bottom-left-radius: 4px;
      }

      .thinking span {
        width: 6px;
        height: 6px;
        background: #555;
        border-radius: 50%;
        animation: bounce 1.2s infinite;
      }

      .thinking span:nth-child(2) {
        animation-delay: 0.2s;
      }
      .thinking span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-6px);
          background: #2563eb;
        }
      }

      #input-area {
        width: 100%;
        max-width: 760px;
        padding: 16px;
        display: flex;
        gap: 10px;
        border-top: 1px solid #2a2a2a;
      }

      #question {
        flex: 1;
        padding: 12px 16px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 12px;
        color: #e0e0e0;
        font-size: 14px;
        outline: none;
        resize: none;
        height: 48px;
        line-height: 1.5;
      }

      #question:focus {
        border-color: #2563eb;
      }

      #question::placeholder {
        color: #555;
      }

      button {
        padding: 12px 20px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      button:hover {
        background: #1d4ed8;
      }
      button:disabled {
        background: #1e3a6e;
        cursor: not-allowed;
      }

      .examples {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 16px 16px;
        max-width: 760px;
        width: 100%;
      }

      .example-chip {
        padding: 6px 12px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 20px;
        font-size: 12px;
        color: #888;
        cursor: pointer;
        transition: all 0.2s;
      }

      .example-chip:hover {
        border-color: #2563eb;
        color: #e0e0e0;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🤗 HF Docs Agent</h1>
      <span>Powered by RAG · Transformers & PEFT docs</span>
    </header>

    <div id="chat-container"></div>

    <div class="examples" id="examples">
      <div class="example-chip" onclick="useExample(this)">
        What does save_pretrained save to disk?
      </div>
      <div class="example-chip" onclick="useExample(this)">
        How do I apply LoRA with PEFT?
      </div>
      <div class="example-chip" onclick="useExample(this)">
        What is the difference between LoRA and QLoRA?
      </div>
      <div class="example-chip" onclick="useExample(this)">
        Show me how save_pretrained is implemented
      </div>
    </div>

    <div id="input-area">
      <textarea
        id="question"
        placeholder="Ask anything about HF Transformers or PEFT..."
      ></textarea>
      <button id="send-btn" onclick="sendMessage()">Ask</button>
    </div>

    <script>
      const chat = document.getElementById("chat-container");
      const input = document.getElementById("question");
      const btn = document.getElementById("send-btn");

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      function useExample(el) {
        input.value = el.textContent;
        input.focus();
      }

      function addMessage(text, role) {
        const wrapper = document.createElement("div");
        wrapper.className = `message ${role}`;
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = role === "user" ? "You" : "Agent";
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        wrapper.appendChild(label);
        wrapper.appendChild(bubble);
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
        return wrapper;
      }

      function addThinking() {
        const wrapper = document.createElement("div");
        wrapper.className = "message agent";
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = "Agent";
        const dots = document.createElement("div");
        dots.className = "thinking";
        dots.innerHTML = "<span></span><span></span><span></span>";
        wrapper.appendChild(label);
        wrapper.appendChild(dots);
        chat.appendChild(wrapper);
        chat.scrollTop = chat.scrollHeight;
        return wrapper;
      }

      async function sendMessage() {
        const question = input.value.trim();
        if (!question) return;

        // Hide examples after first message
        document.getElementById("examples").style.display = "none";

        input.value = "";
        btn.disabled = true;

        addMessage(question, "user");
        const thinking = addThinking();

        try {
          const res = await fetch("/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });

          const data = await res.json();
          thinking.remove();
          addMessage(data.answer || "No answer returned.", "agent");
        } catch (err) {
          thinking.remove();
          addMessage("Something went wrong. Please try again.", "agent");
        }

        btn.disabled = false;
        input.focus();
      }
    </script>
  </body>
</html>
